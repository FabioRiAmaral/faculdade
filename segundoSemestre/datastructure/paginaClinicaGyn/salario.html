<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <script type="module" src="./scripts/main.js" defer></script>
  <link rel="stylesheet" href="./style.css">
  <title>Clínica GYN</title>
</head>
<body>
  <header>
    <h1><a href="./index.html">Clínica Gyn</a></h1>
    <ul style="list-style: none;">
      <li><a href="./index.html">Pacientes</a></li>
      <li><a href="./salario.html">Funcionarios</a></li>
    </ul>
  </header>
  <main>
    <form id="formSalario">
      <fieldset class="fieldsetSalario">
        <legend>Dados do Funcionario para Cálculo</legend>
        <div>
          <label for="inMatriculaFuncionario">Matricula</label>
          <input name="matricula" type="number" id="inMatriculaFuncionario" placeholder="......-." required>
        </div>
        <div class="subCamposSalario">
          <div>
            <label for="inNomeFuncionario">Nome</label>
            <input name="nome" type="text" id="inNomeFuncionario" required>
          </div>
          <div>
            <label for="inNumDependentes">Dependentes</label>
            <input name="dependentes" type="number" id="inNumDependentes" required>
          </div>
          <div>
            <label for="inSalarioBase">Sálario Base</label>
            <input name="salarioBase" type="number" id="inSalarioBase" required>
          </div>
          <div>
            <label for="inProducao">Produção</label>
            <input name="producao" type="number" id="inProducao" required>
          </div>
        </div>
        <div class="buttons">
          <input id="inConsultarSalario" type="submit" value="Consultar"></input>
          <input type="reset" value="Redefinir"></input>
        </div>
      </fieldset>
    </form>
    <table border="1" style="height: fit-content;">
      <thead>
        <tr>
          <th id="outMatricula" colspan="2"></th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th id="tableSalarioBase"></th>
          <td id="outSalarioBase"></td>
        </tr>
        <tr>
          <th id="tableGratificacao"></td>
          <td id="outGratificacao"></td>
        </tr>
        <tr>
          <th id="tableSalarioBruto"></th>
          <td id="outSalarioBruto"></td>
        </tr>
        <tr>
          <th id="tableInss"></th>
          <td id="outInss"></td>
        </tr>
        <tr>
          <th id="tableIrpf"></th>
          <td id="outIrpf"></td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <th id="outSalarioLiquido" colspan="2"></th>
        </tr>
      </tfoot>
    </table>
  </main>
  <div>
</body>
</html>
