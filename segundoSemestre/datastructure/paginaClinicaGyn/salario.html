<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <script type="module" src="./scripts/main.js" defer></script>
  <link rel="stylesheet" href="./style.css">
  <title>Clínica GYN</title>
</head>
<body>
  <header>
    <h1><a href="./index.html">Clínica Gyn</a></h1>
    <ul style="list-style: none;">
      <li><a href="./index.html">Pacientes</a></li>
      <li><a href="./salario.html">Funcionarios</a></li>
    </ul>
  </header>
  <main>
    <form>
      <fieldset class="fieldsetSalario">
        <legend>Dados do Funcionario para Cálculo</legend>
        <div>
          <label for="inMatriculaFuncionario">Matricula</label>
          <input type="number" id="inMatriculaFuncionario" placeholder="......-." required>
        </div>
        <div class="subCamposSalario">
          <div>
            <label for="inNomeFuncionario">Nome</label>
            <input type="text" id="inNomeFuncionario" required>
          </div>
          <div>
            <label for="inNumDependentes">Dependentes</label>
            <input type="number" id="inNumDependentes" required>
          </div>
          <div>
            <label for="inSalarioBase">Sálario Base</label>
            <input type="number" id="inSalarioBase" required>
          </div>
          <div>
            <label for="inProducao">Produção</label>
            <input type="number" id="inProducao" required>
          </div>
        </div>
        <div class="buttons">
          <input id="inConsultar" type="submit" value="Consultar"></input>
          <input type="reset" value="Redefinir"></input>
        </div>
      </fieldset>
    </form>
  </main>
</body>
</html>
