<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ResumoGeral</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <form action="./field.html" method="post">
		<fieldset>
			<legend>Dados Pessoais</legend>
			<div>
			  <label for="inNome">Nome Completo</label><br>
        <input type="text" id="inNome" name="nome" placeholder="Digite seu nome" minlength="4" maxlength="20" required><br>
      </div>
			<div>
				<label for="inCpf">CPF</label><br>
				<input type="text" id="inCpf" name="cpf" placeholder="xxx.xxx.xxx-xx" pattern="\d{3}\.\d{3}\.\d{3}-\d{2}"  required>
			</div>
			<div>
        <label for="inDate">Data de Nascimento</label><br>
        <input type="date" id="inDate" name="data" required>
			</div>
      <div>
        <label>sexo: </label>
        <input type="radio" id="inMasculino" name="sexo" value="M" required>
        <label for="inMasculino">Masculino</label>
        <input type="radio" id="inFeminino" name="sexo" value="F" required>
        <label for="inFeminino">Feminino</label>
      </div>
      <div>
        <label>Estado Civil: </label>
        <select name="EstadoCivil" id="inEstCivil" required>
          <option value="solteiro">Solteiro</option>
          <option value="casado">Casado</option>
          <option value="divorciado">Divorciado</option>
          <option value="viuvo">Viúvo</option>
        </select>
      </div>
		</fieldset>
    <fieldset>
      <legend>Dado de contato</legend>
      <div>
        <label for="inEmail">E-mail:</label><br>
        <input type="email" id="inEmail" name="email" placeholder="email@email.com" required>
      </div>
      <div>
        <label for="insite">Website:</label><br>
        <input type="site" id="insite" name="websit" placeholder="www.website.com" required>
      </div>
      <div>
        <label for="inEndereco">Endereço:</label><br>
        <input type="text" id="inEndereco" name="Endereço" placeholder="Digite seu endereço" required>
      </div>
      <div>
        <label for="inBairro">Bairro:</label><br>
        <input type="text" id="inBairro" name="bairro" placeholder="Digite seu bairro" required>
      </div>
      <div>
        <label for="inCidade">Bairro:</label><br>
        <input type="text" id="inCidade" name="cidade" placeholder="Digite sua cidade" required>
      </div>
      <div>
        <label>UF: </label>
        <select name="uf" id="inUf" required>
          <option value="ac">AC</option>
          <option value="al">AL</option>
          <option value="ap">AP</option>
          <option value="am">AM</option>
          <option value="ba">BA</option>
          <option value="ce">CE</option>
          <option value="es">ES</option>
          <option value="go">GO</option>
          <option value="df">DF</option>
          <option value="ma">MA</option>
          <option value="mt">MT</option>
          <option value="ms">MS</option>
          <option value="mg">MG</option>
          <option value="pa">PA</option>
          <option value="pb">PB</option>
          <option value="pr">PR</option>
          <option value="pe">PE</option>
          <option value="pi">PI</option>
          <option value="rj">RJ</option>
          <option value="rn">RN</option>
          <option value="rs">RS</option>
          <option value="ro">RO</option>
          <option value="rr">RR</option>
          <option value="rc">SC</option>
          <option value="sp">SP</option>
          <option value="se">SE</option>
          <option value="to">TO</option>
        </select>
      </div>
      <div>
        <label for="inCep">CEP:</label><br>
        <input type="text" id="inCep" name="cep" placeholder="00000-000" pattern="\d{5}-\d{3}" required>
      </div>
      <div>
        <label for="inTel">Telefone:</label><br>
        <input type="text" id="inTel" name="cidade" placeholder="Digite seu telefone" required>
      </div>
      <div>
        <label for="inCelular">Bairro:</label><br>
        <input type="text" id="inCelular" name="celular" placeholder="Digite seu celular" required>
      </div>
    </fieldset>

    <fieldset style="max-width: 42rem;">
      <legend>Dados de Cadastro</legend>
      <div>
        <label for="inLogin">CEP:</label><br>
        <input type="text" id="inLogin" name="login" placeholder="Login" required>
      </div>
      <div>
        <label for="inSenha">Senha:</label><br>
        <input type="text" id="inSenha" name="senha" placeholder="Senha" required>
      </div>
      <div>
        <label for="">Deseja receber informações sobre:</label><br>
        <div>
          <input type="checkbox" id="inTec" name="interesses" value="tec">
          <label for="inTec">Tecnologia</label>
          <input type="checkbox" id="inEsp" name="interesses" value="esporte">
          <label for="inEsp">Esporte</label>
          <input type="checkbox" id="inAut" name="interesses" value="automoveis">
          <label for="inAut">Automoveis</label>
          <input type="checkbox" id="inCulinaria" name="interesses" value="culinaria">
          <label for="inCulinaria">Culinaria</label>
          <input type="checkbox" id="inPolitica" name="interesses" value="Politica">
          <label for="inPolitica">Politica</label>
          <input type="checkbox" id="inTempo" name="interesses" value="Tempo">
          <label for="inTempo">Tempo</label>
          <input type="checkbox" id="inCultura" name="interesses" value="Cultura">
          <label for="inCultura">Cultura</label><br>
          <input type="checkbox" id="inEconomia" name="interesses" value="Economia">
          <label for="inEconomia">Economia</label>
          <input type="checkbox" id="inJogos" name="interesses" value="Jogos">
          <label for="inJogos">Jogos</label>
          <input type="checkbox" id="inEducacao" name="interesses" value="Educacao">
          <label for="inEducacao">Educação</label>
          <input type="checkbox" id="inViagem" name="interesses" value="Viagem">
          <label for="inViagem">Viagem</label>
          <input type="checkbox" id="inEmpregos" name="interesses" value="Empregos">
          <label for="inEmpregos">Empregos</label>
          <input type="checkbox" id="inModa" name="interesses" value="Moda">
          <label for="inModa">Moda e Estilo</label><br>
          <input type="checkbox" id="inAgree" name="interesses" value="Agree">
          <label for="inAgree">Li as regras de cadastro e autorizo a criação do usuário</label>
        </div>
      </div>
      <div style="margin-top: 0.5rem;">
        <input type="submit" value="Enviar"></input>
        <input type="reset" value="Redefinir"></input>
    </div>
    </fieldset>
	</form>
</body>
</html>
