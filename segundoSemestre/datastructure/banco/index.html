<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fila de Banco</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="scripts/app.js" defer></script>
</head>
<body>
  <main class="painel">
    <header class="topo">
      <img src="./Imagem colada.png" class="logo">
      <h1>Fila de Banco</h1>
      <img src="./Imagem colada.png" class="foto">
    </header>
    <section class="controles">
      <div class="campo">
        <label for="inNome">Nome</label>
        <input type="text" id="inNome">
        <button type="button" id="btnIncluir" class="primario">Incluir na fila</button>
      </div>
      <div class="acoes">
        <button type="button" id="btnRetirar">Retirar</button>
        <button type="button" id="btnAcessar">Acessar</button>
      </div>
      <p class="primeiro">
        Primeiro da fila:
        <strong id="outPrimeiro">Não tem pessoa</strong>
      </p>
      <p id="outMensagem" class="mensagem"></p>
    </section>
    <section class="mostrar">
      <h2>Mostrar fila</h2>
      <p class="linha-fila">fila = <span id="outFila"></span></p>
    </section>
  </main>
</body>
</html>
